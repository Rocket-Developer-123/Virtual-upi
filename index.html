<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual UPI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #002970;
            --accent: #00b9f5;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-dark); padding-bottom: 90px; }
        .container { max-width: 450px; margin: auto; padding: 15px; }
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2, h3 { color: var(--primary); margin-bottom: 15px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #d1d5db; font-size: 15px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-danger { background: #ef4444; }
        .btn-success { background: #22c55e; }
        .btn-dark { background: #1f2937; }
        .link-text { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
        
        .top-header { background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; }
        .balance-banner { background: linear-gradient(135deg, #002970, #0056b3); color: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .txn-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="auth-screen" class="container" style="margin-top: 40px;">
        <div id="login-section" class="card">
            <h2 style="text-align: center;">Virtual UPI</h2>
            <input type="text" id="log-upi" placeholder="Enter UPI ID">
            <input type="password" id="log-pin" placeholder="Enter 4-Digit PIN" maxlength="4">
            <button class="btn-primary" onclick="login()">Login</button>
            <p style="font-size: 13px; text-align: center; margin-top: 15px;">
                <span class="link-text" onclick="toggleAuth('register')">Create Account</span>
            </p>
        </div>

        <div id="register-section" class="card hidden">
            <h2 style="text-align: center;">Create Account</h2>
            <input type="text" id="reg-name" placeholder="Full Name">
            <input type="text" id="reg-upi" placeholder="Create UPI ID">
            <input type="password" id="reg-pin" placeholder="Create 4-Digit PIN" maxlength="4">
            <button class="btn-primary" onclick="register()">Sign Up</button>
            <p style="font-size: 13px; text-align: center; margin-top: 15px;">
                <span class="link-text" onclick="toggleAuth('login')">Back to Login</span>
            </p>
        </div>
    </div>

    <!-- STANDARD USER DASHBOARD -->
    <div id="dashboard-screen" class="hidden">
        <header class="top-header">
            <div><h3 id="user-display-name" style="margin:0;">User</h3><p id="my-upi" style="font-size: 12px;"></p></div>
            <button class="btn-dark" style="padding: 6px 12px; width: auto;" onclick="logout()">Logout</button>
        </header>
        <div class="container">
            <div class="balance-banner">
                <p>Available Balance</p>
                <h1 style="margin: 5px 0;">₹<span id="live-balance">0.00</span></h1>
            </div>
            <div class="card">
                <h3>Send Money</h3>
                <input type="text" id="pay-receiver" placeholder="Receiver UPI ID">
                <input type="number" id="pay-amount" placeholder="Amount (₹)">
                <input type="password" id="pay-pin" placeholder="Enter PIN" maxlength="4">
                <button class="btn-primary" onclick="pay()">Pay Securely</button>
            </div>
            <div class="card">
                <h3>Passbook <button onclick="loadHistory()" style="float:right; font-size:12px; padding:4px;">Refresh</button></h3>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <!-- SYSTEM OWNER PANEL (BOSS0) -->
    <div id="owner-screen" class="hidden">
        <header class="top-header" style="background: #1f2937; color: white;">
            <div><h3 style="margin:0; color:#00b9f5;">SYSTEM OPERATOR</h3><p style="font-size: 12px;">Boss0</p></div>
            <button class="btn-danger" style="padding: 6px 12px; width: auto; color: white;" onclick="logout()">Exit</button>
        </header>
        <div class="container">
            <!-- Fund Management -->
            <div class="card">
                <h3>Account Management</h3>
                <input type="text" id="admin-target" placeholder="Target UPI ID (e.g., friend@upi)">
                <input type="number" id="admin-amount" placeholder="Amount (₹)">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary btn-success" onclick="adminAdjust('add')">+ Inject Funds</button>
                    <button class="btn-primary btn-danger" onclick="adminAdjust('deduct')">- Deduct Funds</button>
                </div>
                <button class="btn-primary btn-dark" onclick="adminDelete()" style="margin-top: 15px;">⚠ Terminate Account</button>
            </div>

            <!-- Spy / Ledger Access -->
            <div class="card">
                <h3>Transaction Surveillance</h3>
                <input type="text" id="admin-spy-target" placeholder="UPI ID (Leave blank for ALL network data)">
                <button class="btn-primary" onclick="adminViewTransactions()">View Records</button>
                <div id="admin-ledger" style="margin-top: 15px; max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentPin = "";

        function toggleAuth(view) {
            document.getElementById('login-section').classList.toggle('hidden', view === 'register');
            document.getElementById('register-section').classList.toggle('hidden', view === 'login');
        }

        function logout() {
            currentUser = ""; currentPin = "";
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('owner-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const upi_id = document.getElementById('reg-upi').value;
            const pin = document.getElementById('reg-pin').value;
            const res = await fetch('/register', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({upi_id, name, pin}) });
            if((await res.json()).success) { alert("Account Created!"); toggleAuth('login'); }
        }

        async function login() {
            const upi_id = document.getElementById('log-upi').value;
            const pin = document.getElementById('log-pin').value;
            const res = await fetch('/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({upi_id, pin}) });
            const data = await res.json();
            
            if(data.success) {
                currentUser = upi_id;
                currentPin = pin;
                document.getElementById('auth-screen').classList.add('hidden');
                
                // ROUTING INTERCEPTOR FOR BOSS0
                if(currentUser === 'Boss0') {
                    document.getElementById('owner-screen').classList.remove('hidden');
                    adminViewTransactions(); // Auto-load network history
                } else {
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('user-display-name').innerText = data.user.name;
                    document.getElementById('my-upi').innerText = currentUser;
                    updateBalance();
                    loadHistory();
                }
            } else alert(data.error);
        }

        // --- Standard User Functions ---
        async function pay() {
            const receiver = document.getElementById('pay-receiver').value;
            const amount = document.getElementById('pay-amount').value;
            const pin = document.getElementById('pay-pin').value;
            const res = await fetch('/pay', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sender: currentUser, receiver, pin, amount}) });
            if((await res.json()).success) { alert("Sent!"); updateBalance(); loadHistory(); } else alert("Failed.");
        }
        async function updateBalance() {
            const res = await fetch('/balance/' + currentUser);
            document.getElementById('live-balance').innerText = (await res.json()).balance.toFixed(2);
        }
        async function loadHistory() {
            const res = await fetch('/history/' + currentUser);
            const data = await res.json();
            document.getElementById('history-list').innerHTML = data.map(t => {
                const isSender = t.sender === currentUser;
                return `<div class="txn-row"><span style="color:${isSender?'#ef4444':'#22c55e'}">${isSender?'-':'+'}₹${t.amount}</span><span>${isSender?'To: '+t.receiver:'From: '+t.sender}</span></div>`;
            }).join('');
        }

        // --- BOSS0 OWNER FUNCTIONS ---
        async function adminAdjust(action) {
            const target_id = document.getElementById('admin-target').value;
            const amount = document.getElementById('admin-amount').value;
            if(!target_id || !amount) return alert("Enter target and amount.");
            
            const res = await fetch('/admin/adjust', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ admin_id: currentUser, admin_pin: currentPin, target_id, amount, action })
            });
            if((await res.json()).success) { alert(`Successfully applied ${action} action to ${target_id}`); adminViewTransactions(); }
        }

        async function adminDelete() {
            const target_id = document.getElementById('admin-target').value;
            if(!target_id) return;
            if(!confirm(`PERMANENTLY delete ${target_id} and wipe their history?`)) return;
            
            const res = await fetch('/admin/delete', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ admin_id: currentUser, admin_pin: currentPin, target_id })
            });
            if((await res.json()).success) alert("Account Terminated.");
        }

        async function adminViewTransactions() {
            const target_id = document.getElementById('admin-spy-target').value;
            const res = await fetch('/admin/transactions', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ admin_id: currentUser, admin_pin: currentPin, target_id })
            });
            const data = await res.json();
            
            document.getElementById('admin-ledger').innerHTML = data.data.map(t => `
                <div class="txn-row" style="background:#f3f4f6; padding:10px; border-radius:6px; margin-bottom:8px;">
                    <div><b style="color:#002970;">${t.sender}</b> ➔ <b style="color:#00b9f5;">${t.receiver}</b></div>
                    <div style="font-weight:bold;">₹${t.amount}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
