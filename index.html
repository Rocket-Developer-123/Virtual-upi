/* ---- REAL-TIME DUAL-USER PASSBOOK SYNC ---- */
async function syncUserPassbook(silent = true){
  if (!S.u || !S.u.fullId || S.scr === 'login' || S.scr === 'reg' || S.scr === 'boss') return;
  const myId = S.u.fullId.toLowerCase();

  let serverSynced = false;
  try {
    const res = await fetch(`/api/user-state/${encodeURIComponent(myId)}?t=${Date.now()}`, {
      method: 'GET',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
      cache: 'no-store'
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.success) {
        serverSynced = true;
        const prevBal = S.bal;
        const prevTopRef = S.tx[0] ? S.tx[0].ref : '';

        S.bal = Number(data.balance);
        S.u.n = data.name || S.u.n;
        S.u.status = data.status || 'ACTIVE';
        S.u.type = data.account_type === 'MERCHANT' ? 'Merchant' : 'Personal';
        S.tx = Array.isArray(data.transactions) ? data.transactions : [];
        S.ppl = Array.isArray(data.contacts) ? data.contacts.filter(p => p.id.toLowerCase() !== myId) : S.ppl;

        const newSig = `${S.bal}_${S.tx.length}_${S.tx[0]?S.tx[0].ref:''}_${S.u.status}`;
        if (S.lastSyncSig && S.lastSyncSig !== newSig) {
          if (S.bal > prevBal && S.tx[0] && S.tx[0].a > 0 && S.tx[0].ref !== prevTopRef) {
            S.unreadAlert = `Received K ${fm(S.tx[0].a)} from ${S.tx[0].n}`;
            if (S.notif) T(S.unreadAlert);
          }
          render();
        }
        S.lastSyncSig = newSig;
      }
    }
  } catch (e) {}

  if (!serverSynced) {
    const ledger = loadLedger();
    const acc = ledger.accounts[myId] || ledger.accounts[S.u.fullId];
    if (acc) {
      const prevBal = S.bal;
      const prevTopRef = S.tx[0] ? S.tx[0].ref : '';

      S.bal = Number(acc.bal);
      S.u.n = acc.n;
      S.u.status = acc.status || 'ACTIVE';
      S.u.type = acc.type || 'Personal';
      S.u.claimed = Array.isArray(acc.claimed) ? acc.claimed : [];
      S.tx = acc.tx.slice();
      S.ppl = Object.values(ledger.accounts)
        .filter(x => x.id.toLowerCase() !== myId && x.id !== 'Boss0')
        .map(x => ({ n: x.n, id: x.id }));

      const newSig = `${S.bal}_${S.tx.length}_${S.tx[0]?S.tx[0].ref:''}_${S.u.status}`;
      if (S.lastSyncSig && S.lastSyncSig !== newSig) {
        if (S.bal > prevBal && S.tx[0] && S.tx[0].a > 0 && S.tx[0].ref !== prevTopRef) {
          S.unreadAlert = `Received K ${fm(S.tx[0].a)} from ${S.tx[0].n}`;
          if (S.notif) T(S.unreadAlert);
        }
        if (!silent || S.sheet !== 'pay') render();
      }
      S.lastSyncSig = newSig;
    }
  }
}

/* ---- QR GENERATOR ---- */
function fallbackSvgQr(){
  const n=25;let s=7,o='';const r=()=>(s=(s*9301+49297)%233280)/233280;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on,f=0;
    for(const[a,b]of[[0,0],[n-7,0],[0,n-7]])if(x>=a&&x<a+7&&y>=b&&y<b+7){const i=x-a,j=y-b;f=1;on=i%6==0||j%6==0||(i>1&&i<5&&j>1&&j<5)}
    if(!f)on=((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))?0:r()>.52;
    if(on)o+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="190" height="190" fill="#04142A" role="img" aria-label="Your Kinex QR code">${o}</svg>`;
}
function renderRealQR(){
  const box = $('#live-qr-box');
  if (!box) return;
  const reqAmt = parseFloat(S.qrReqAmt);
  let payload = `${S.u.id}@rpay`;
  if (Number.isFinite(reqAmt) && reqAmt >= 1) {
    const cleanAmt = Math.round(reqAmt * 100) / 100;
    payload = `upi://pay?pa=${encodeURIComponent(S.u.id+'@rpay')}&am=${cleanAmt}`;
  }
  if (window.QRCode) {
    box.innerHTML = '';
    new QRCode(box, { text: payload, width: 190, height: 190, colorDark: '#04142A', colorLight: '#ffffff' });
  } else {
    box.innerHTML = fallbackSvgQr();
  }
}

/* ---- TWO-STAGE CAMERA CONTROLLER ---- */
let html5QrInstance = null;
async function startLiveCamera(){
  if (!window.Html5Qrcode) return;
  try {
    const readerEl = $('#cam-reader');
    if (!readerEl) return;
    if (!html5QrInstance) html5QrInstance = new Html5Qrcode('cam-reader');
    if (html5QrInstance.isScanning) await html5QrInstance.stop();
    await html5QrInstance.start(
      { facingMode: S.facing },
      { fps: 12, qrbox: { width: 230, height: 230 } },
      (decodedText) => handleScannedPayload(decodedText),
      () => {}
    );
    if (S.torch && S.facing === 'environment') {
      try { await html5QrInstance.applyVideoConstraints({ advanced: [{ torch: true }] }); } catch(e){}
    }
  } catch (e) {
    const pill = $('#live-scan-pill');
    if (pill) pill.textContent = 'Preview mode · Tap below to simulate scan';
  }
}
async function stopLiveCamera(){
  try {
    if (html5QrInstance && html5QrInstance.isScanning) await html5QrInstance.stop();
  } catch (e) {}
  S.scan = false;
  S.scanStage = 'standby';
}
async function handleScannedPayload(rawText){
  await stopLiveCamera();
  const raw = String(rawText||'').trim();
  let targetId = '';
  let lockedAmt = null;

  if (raw.toLowerCase().startsWith('upi://pay')) {
    const qs = raw.split('?')[1] || '';
    const params = new URLSearchParams(qs);
    targetId = cleanHandle(params.get('pa') || '');
    lockedAmt = params.get('am');
  } else if (/^[a-z0-9._-]+@[a-z0-9]+$/i.test(raw)) {
    targetId = cleanHandle(raw);
  } else {
    render();
    return T('Unrecognized QR code. Scan a valid @rpay QR.');
  }
  if (!targetId) { render(); return T('Invalid Kinex QR code'); }
  if (targetId.toLowerCase() === S.u.fullId.toLowerCase()) { render(); return T('You cannot scan and pay your own QR code'); }

  const found = S.ppl.find(p => p.id.toLowerCase() === targetId.toLowerCase()) || {
    n: shortId(targetId)[0].toUpperCase() + shortId(targetId).slice(1),
    id: targetId
  };
  openPay(found, 'amt', lockedAmt);
  render();
}
$('#qr-file-input').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file || !window.Html5Qrcode) return;
  try {
    await stopLiveCamera();
    const fs = new Html5Qrcode('file-qr-reader');
    const decoded = await fs.scanFile(file, true);
    fs.clear();
    ev.target.value = '';
    handleScannedPayload(decoded);
  } catch (e) {
    ev.target.value = '';
    T('No valid QR code found in that image');
  }
});

/* ---- AUTH & DUAL-PASSBOOK PAYMENT EXECUTION ---- */
async function pinDone(){
  const enteredPin = S.pin;
  S.pin = '';

  // 1. LOGIN
  if (S.ctx === 'login') {
    const fullId = cleanHandle(S.lid || 'ridhaan');
    const short = shortId(fullId);
    const ledger = loadLedger();

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ upi_id: fullId, pin: enteredPin })
      });
      if (res.ok) {
        const data = await res.json();
        if (data.success) {
          S.u = { n: data.name || (short[0].toUpperCase()+short.slice(1)), id: short, fullId, type: data.account_type === 'MERCHANT' ? 'Merchant' : 'Personal', status: data.status || 'ACTIVE', claimed: [] };
          S.scr = 'home'; S.top = true;
          await syncUserPassbook(false);
          render();
          return T('Welcome back, ' + S.u.n);
        }
      }
    } catch (e) {}

    if (!ledger.accounts[fullId]) {
      ledger.accounts[fullId] = {
        id: fullId, n: short[0].toUpperCase() + short.slice(1), pin: enteredPin,
        ph: '9000000000', dob: '2000-01-01', type: 'Personal', status: 'ACTIVE', bal: 500, claimed: [],
        tx: [{ n: 'Welcome bonus', id: 'system@rpay', d: 'Today', t: tm(), a: 500, ref: 'KX' + Math.floor(1e7 + Math.random() * 9e7) }]
      };
      saveLedger(ledger);
    }

    const acc = ledger.accounts[fullId];
    S.u = { n: acc.n, id: short, fullId: acc.id, type: acc.type || 'Personal', status: acc.status || 'ACTIVE', claimed: acc.claimed || [] };
    S.bal = Number(acc.bal);
    S.tx = acc.tx.slice();
    S.ppl = Object.values(ledger.accounts).filter(x => x.id.toLowerCase() !== fullId && x.id !== 'Boss0').map(x => ({ n: x.n, id: x.id }));
    S.lastSyncSig = `${S.bal}_${S.tx.length}_${S.tx[0]?S.tx[0].ref:''}_${S.u.status}`;
    S.scr = 'home'; S.top = true;
    render();
    return T('Welcome back, ' + S.u.n);
  }

  // 2. REGISTER
  if (S.ctx === 'reg') {
    const fullId = cleanHandle(S.r.id);
    const short = shortId(fullId);
    const bonusRef = 'KX' + Math.floor(1e7 + Math.random() * 9e7);

    try {
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          upi_id: fullId, name: S.r.name.trim(), pin: enteredPin,
          phone: S.r.ph, dob: S.r.dob || '2005-01-01', account_type: S.r.type.toUpperCase()
        })
      });
      if (res.ok) {
        const data = await res.json();
        if (!data.success && data.suggestions) {
          S.rs = 1; S.r.suggestions = data.suggestions;
          render();
          return T('That Kinex ID is taken. Choose a suggestion.');
        }
      }
    } catch (e) {}

    const ledger = loadLedger();
    ledger.accounts[fullId] = {
      id: fullId, n: S.r.name.trim(), pin: enteredPin, ph: S.r.ph, dob: S.r.dob || '2005-01-01',
      type: S.r.type, status: 'ACTIVE', bal: 500, claimed: [],
      tx: [{ n: 'Welcome bonus', id: 'system@rpay', d: 'Today', t: tm(), a: 500, ref: bonusRef }]
    };
    saveLedger(ledger);

    S.u = { n: S.r.name.trim(), id: short, fullId, type: S.r.type, status: 'ACTIVE', claimed: [] };
    S.bal = 500;
    S.tx = ledger.accounts[fullId].tx.slice();
    S.ppl = Object.values(ledger.accounts).filter(x => x.id.toLowerCase() !== fullId && x.id !== 'Boss0').map(x => ({ n: x.n, id: x.id }));
    S.lastSyncSig = `${S.bal}_${S.tx.length}_${bonusRef}_ACTIVE`;
    S.scr = 'home'; S.top = true;
    await syncUserPassbook(false);
    render();
    return T('Account ready · K 500 bonus added');
  }

  // 3. PAYMENT (SYNCS BOTH SENDER & RECEIVER PASSBOOKS)
  if (S.ctx === 'pay' && S.pay) {
    if (S.isPaying) return;
    const ledgerCheck = loadLedger();
    if (ledgerCheck.maintenance) return T('Network is under maintenance. Transfers paused.');

    S.isPaying = true;
    S.pay.step = 'proc';
    render();

    const a = Math.round(parseFloat(S.pay.amt) * 100) / 100;
    const senderId = S.u.fullId.toLowerCase();
    const receiverId = cleanHandle(S.pay.to.id).toLowerCase();
    const ref = 'KX' + Math.floor(1e7 + Math.random() * 9e7);
    const nowTime = tm();

    let backendError = null;
    try {
      const res = await fetch('/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: senderId, receiver: receiverId, pin: enteredPin, amount: a })
      });
      if (res.status === 400) {
        const errData = await res.json();
        if (errData && errData.error) backendError = errData.error;
      }
    } catch (e) {}

    setTimeout(async () => {
      S.isPaying = false;
      if (!S.pay) return;
      if (backendError) {
        S.pay.step = 'amt';
        render();
        return T(backendError);
      }

      const ledger = loadLedger();
      if (!ledger.accounts[senderId]) {
        ledger.accounts[senderId] = { id: senderId, n: S.u.n, pin: '1234', bal: S.bal, type: S.u.type, status: 'ACTIVE', claimed: [], tx: S.tx.slice() };
      }
      if (!ledger.accounts[receiverId]) {
        ledger.accounts[receiverId] = { id: receiverId, n: S.pay.to.n, pin: '1234', bal: 500, type: 'Personal', status: 'ACTIVE', claimed: [], tx: [] };
      }
      if (ledger.accounts[receiverId].status === 'FROZEN') {
        S.pay.step = 'amt';
        render();
        return T('Receiver account is frozen and cannot accept funds.');
      }

      // Debit Sender & Prepend to Sender Passbook
      ledger.accounts[senderId].bal = Math.round((Number(ledger.accounts[senderId].bal) - a) * 100) / 100;
      ledger.accounts[senderId].tx.unshift({
        n: ledger.accounts[receiverId].n || S.pay.to.n,
        id: receiverId, d: 'Today', t: nowTime, a: -a, ref: ref
      });

      // Credit Receiver & Prepend to Receiver Passbook
      ledger.accounts[receiverId].bal = Math.round((Number(ledger.accounts[receiverId].bal) + a) * 100) / 100;
      ledger.accounts[receiverId].tx.unshift({
        n: ledger.accounts[senderId].n || S.u.n,
        id: senderId, d: 'Today', t: nowTime, a: +a, ref: ref
      });

      saveLedger(ledger);

      S.bal = ledger.accounts[senderId].bal;
      S.tx = ledger.accounts[senderId].tx.slice();
      S.lastSyncSig = `${S.bal}_${S.tx.length}_${ref}_${S.u.status}`;
      S.pay.ref = ref;
      S.pay.step = 'ok';

      await syncUserPassbook(true);
      render();
    }, 950);
  }
}

/* ---- CLICK EVENTS ---- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a == 'close' && b.classList.contains('ov') && e.target !== b) return;

  switch (a) {
    case 'go':
      S.scr = v; S.pin = ''; S.ctx = 'login'; S.rs = 1; S.top = true;
      if (v === 'book' || v === 'home' || v === 'people') await syncUserPassbook(true);
      break;
    case 'k':
      if (v == 'b') S.pin = S.pin.slice(0, -1);
      else if (S.pin.length < 4) S.pin += v;
      render();
      if (S.pin.length == 4) setTimeout(pinDone, 200);
      return;
    case 'auth':
      if (S.pin.length < 4) return T('Enter your 4-digit PIN');
      pinDone();
      return;
    case 'bossauth': {
      const ledger = loadLedger();
      const bossAcc = ledger.accounts['Boss0'];
      if (S.bossPass !== (bossAcc ? bossAcc.pin : 'Kinex_Admin_2026!')) {
        return T('Invalid Operator Password');
      }
      S.bossPass = '';
      S.scr = 'boss';
      S.top = true;
      T('Operator Console Unlocked');
      break;
    }
    case 'bossmaint': {
      const ledger = loadLedger();
      if (S.adminSecret !== ledger.adminSecret) return T('Invalid Master Secret Key');
      ledger.maintenance = !ledger.maintenance;
      saveLedger(ledger);
      T(ledger.maintenance ? 'Network Maintenance Lock ENABLED' : 'Network Live');
      break;
    }
    case 'bossfreeze': {
      const ledger = loadLedger();
      if (S.adminSecret !== ledger.adminSecret) return T('Invalid Master Secret Key');
      const target = ledger.accounts[v];
      if (target) {
        target.status = target.status === 'FROZEN' ? 'ACTIVE' : 'FROZEN';
        saveLedger(ledger);
        T(`${target.id} is now ${target.status}`);
      }
      break;
    }
    case 'bossmint': {
      const ledger = loadLedger();
      if (S.adminSecret !== ledger.adminSecret) return T('Invalid Master Secret Key');
      const tid = cleanHandle(S.bossTargetId).toLowerCase();
      const amt = Math.round((parseFloat(S.bossMintAmt) || 0) * 100) / 100;
      if (!ledger.accounts[tid] || !amt) return T('Enter a valid @rpay ID and amount');
      const ref = 'KX' + Math.floor(1e7 + Math.random() * 9e7);
      ledger.accounts[tid].bal = Math.max(0, Math.round((ledger.accounts[tid].bal + amt) * 100) / 100);
      ledger.accounts[tid].tx.unshift({
        n: amt > 0 ? 'Network Treasury Mint' : 'Network Treasury Burn',
        id: 'Boss0', d: 'Today', t: tm(), a: amt, ref
      });
      saveLedger(ledger);
      S.bossTargetId = ''; S.bossMintAmt = '';
      T(`Updated ${tid} balance by K ${fm(amt)}`);
      break;
    }
    case 'bossclaw': {
      const ledger = loadLedger();
      if (S.adminSecret !== ledger.adminSecret) return T('Invalid Master Secret Key');
      let senderAcc = null, receiverAcc = null, txAmt = 0;
      Object.values(ledger.accounts).forEach(acc => {
        const found = (acc.tx || []).find(t => t.ref === v);
        if (found) {
          if (found.a < 0) { senderAcc = acc; txAmt = Math.abs(found.a); }
          if (found.a > 0) { receiverAcc = acc; }
        }
      });
      if (!senderAcc || !receiverAcc || !txAmt) return T('Transfer record not found');
      const revRef = 'KX' + Math.floor(1e7 + Math.random() * 9e7);
      senderAcc.bal = Math.round((senderAcc.bal + txAmt) * 100) / 100;
      receiverAcc.bal = Math.max(0, Math.round((receiverAcc.bal - txAmt) * 100) / 100);
      senderAcc.tx.unshift({ n: 'Admin Clawback Refund', id: receiverAcc.id, d: 'Today', t: tm(), a: +txAmt, ref: revRef });
      receiverAcc.tx.unshift({ n: 'Admin Clawback Reversal', id: senderAcc.id, d: 'Today', t: tm(), a: -txAmt, ref: revRef });
      saveLedger(ledger);
      T(`Reversed K ${fm(txAmt)} (${v})`);
      break;
    }
    case 'rtype': S.r.type = v; break;
    case 'pickid': S.r.id = shortId(v); S.r.manual = true; S.r.suggestions = []; break;
    case 'rnext': {
      if (S.r.name.trim().length < 2) return T('Enter your full legal name');
      const cleanId = cleanHandle(S.r.id);
      if (!/^[a-z0-9._]{3,}@rpay\$/i.test(cleanId)) return T('Kinex ID needs 3+ letters or numbers');
      if (!/^\d{10}\$/.test(S.r.ph)) return T('Enter a valid 10-digit mobile number');
      if (!S.r.dob) return T('Select your date of birth');

      const ledger = loadLedger();
      if (ledger.accounts[cleanId]) {
        const base = shortId(cleanId);
        S.r.suggestions = [
          base + Math.floor(Math.random() * 90 + 10) + '@rpay',
          base + Math.floor(Math.random() * 900 + 100) + '@rpay',
          base + (Math.floor(Math.random() * 9000) + 1000) + '@rpay'
        ];
        render();
        return T('That Kinex ID is already taken');
      }
      const dupPhone = Object.values(ledger.accounts).find(x => x.ph === S.r.ph);
      if (dupPhone) return T(`Mobile number already linked to ${dupPhone.id}`);
      S.rs = 2; S.ctx = 'reg'; S.pin = '';
      break;
    }
    case 'rback': S.rs = 1; S.pin = ''; break;
    case 'hide': S.hide = !S.hide; break;
    case 'copy':
      navigator.clipboard && navigator.clipboard.writeText(S.u.id + '@rpay').catch(() => {});
      return T('Kinex ID copied: ' + S.u.id + '@rpay');
    case 'bell':
      if (S.unreadAlert) { const msg = S.unreadAlert; S.unreadAlert = ''; render(); return T(msg); }
      return T('No new alerts');
    case 'earn':
      S.sheet = 'earn'; S.fresh = true;
      break;
    case 'claimq': {
      const q = QUEST_LIST.find(x => x.id === v);
      if (!q) return;
      const ledger = loadLedger();
      const myId = S.u.fullId.toLowerCase();
      const acc = ledger.accounts[myId];
      if (!acc) return;
      acc.claimed = acc.claimed || [];
      if (acc.claimed.includes(q.id)) return T('Quest already claimed');
      const ref = 'KX' + Math.floor(1e7 + Math.random() * 9e7);
      acc.claimed.push(q.id);
      acc.bal = Math.round((acc.bal + q.reward) * 100) / 100;
      acc.tx.unshift({ n: `Quest: ${q.title}`, id: 'system@rpay', d: 'Today', t: tm(), a: +q.reward, ref });
      saveLedger(ledger);
      S.u.claimed = acc.claimed.slice();
      S.bal = acc.bal;
      S.tx = acc.tx.slice();
      T(`Claimed +K ${q.reward} into your Passbook!`);
      break;
    }
    case 'soon': return T(v);
    case 'pay': await syncUserPassbook(true); openPay(null, 'who'); break;
    case 'to': openPay(S.ppl[v], 'amt', null); break;
    case 'again': {
      const t = S.tx[v];
      openPay(S.ppl.find(p => p.n == t.n) || { n: t.n, id: t.id || (t.n.toLowerCase().replace(/\W/g, '') + '@rpay') });
      break;
    }
    case 'qr':
    case 'scanqr':
      await stopLiveCamera(); S.sheet = 'qr'; S.fresh = true; break;
    case 'clearqramt': S.qrReqAmt = ''; break;
    case 'tx': S.sheet = 'tx'; S.txi = +v; S.fresh = true; break;
    case 'f': S.f = v; break;
    case 'sw':
      S[v] = !S[v];
      if (v == 'dark') document.documentElement.dataset.theme = S.dark ? 'dark' : 'light';
      break;
    case 'logout':
      S.scr = 'login'; S.pin = ''; S.ctx = 'login'; S.lastSyncSig = '';
      T('Logged out');
      break;
    case 'scan': S.scan = true; S.scanStage = 'standby'; S.torch = false; break;
    case 'scanx': await stopLiveCamera(); break;
    case 'torch':
      if (S.facing === 'user') return T('Flashlight is only available on Back Camera');
      S.torch = !S.torch; break;
    case 'flipcam':
      S.facing = S.facing === 'environment' ? 'user' : 'environment';
      if (S.facing === 'user') S.torch = false;
      T(S.facing === 'user' ? 'Switched to Front Camera' : 'Switched to Back Camera');
      break;
    case 'qrgallery': \$('#qr-file-input').click(); return;
    case 'armscan':
      S.scanStage = 'live'; render(); await startLiveCamera(); return;
    case 'sim':
      await stopLiveCamera();
      openPay(S.ppl[Math.floor(Math.random() * S.ppl.length)]);
      T('QR detected');
      break;
    case 'ak': {
      const p = S.pay;
      if (p.locked) return;
      if (v == 'b') p.amt = p.amt.slice(0, -1);
      else if (v == '.') { if (!p.amt.includes('.')) p.amt = (p.amt || '0') + '.'; }
      else if (p.amt == '0') p.amt = v;
      else if (p.amt.replace('.', '').length < 7 && !/\.\d\d\$/.test(p.amt)) p.amt += v;
      break;
    }
    case 'qa': if (S.pay && !S.pay.locked) S.pay.amt = String((parseFloat(S.pay.amt) || 0) + +v); break;
    case 'cont': S.pay.step = 'pin'; S.pin = ''; S.fresh = true; break;
    case 'close': S.sheet = null; S.pay = null; S.pin = ''; await syncUserPassbook(true); break;
  }
  render();
});

document.documentElement.dataset.theme = S.dark ? 'dark' : 'light';
(function init(){
  const ledger = loadLedger();
  const defAcc = ledger.accounts['ridhaan@rpay'];
  if (defAcc) {
    S.bal = defAcc.bal;
    S.tx = defAcc.tx.slice();
    S.ppl = Object.values(ledger.accounts).filter(x => x.id !== 'ridhaan@rpay' && x.id !== 'Boss0').map(x => ({ n: x.n, id: x.id }));
  }
  render();
})();
</script>
