<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPAY — Notice</title>
<style>
  :root {
    --navy-bg: #060c1f;
    --navy-card: #0b1530;
    --navy-card-2: #0f1c40;
    --cyan: #22e8ff;
    --cyan-dim: #22e8ff55;
    --silver: #c7d2e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #0d1a3f 0%, var(--navy-bg) 60%);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, var(--navy-card) 0%, var(--navy-card-2) 100%);
    border: 1px solid var(--cyan-dim);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 0 40px var(--cyan-dim), 0 10px 30px rgba(0,0,0,0.5);
  }
  .coin {
    width: 96px;
    height: 96px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 18px var(--cyan-dim), 0 4px 14px rgba(0,0,0,0.5);
  }
  .coin img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .icon {
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan);
    font-size: 28px;
    font-weight: 900;
    box-shadow: 0 0 16px var(--cyan-dim);
  }
  h1 {
    color: var(--silver);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 14px;
    opacity: 0.7;
  }
  .message {
    font-weight: 800;
    font-size: 22px;
    line-height: 1.5;
    color: #ffffff;
    text-shadow: 0 0 12px var(--cyan-dim);
    margin: 0 0 8px;
  }
  .sub {
    color: var(--cyan);
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 18px;
    opacity: 0.85;
  }
  .bar {
    width: 60px;
    height: 3px;
    background: var(--cyan);
    margin: 22px auto 22px;
    border-radius: 2px;
    box-shadow: 0 0 10px var(--cyan);
  }
</style>
</head>
